# The poster library. One entry = one finished design (a layout file + a colour theme).
# The selector (select_template.py) scores every entry against the story: its category, tone, whether it has a
# photo / a striking number / a quotation, and how long the headline is. It never picks at random: it picks among the
# best fits and avoids what was used recently. NO YELLOW anywhere (client requirement).
#
#   photo:       required | optional | none   (how the design uses a photo)
#   photo_heavy: true                         (optional photo, but the design looks thin without one: avoided then)
#   needs:       [stat] and/or [quote]        (the story must have one, or the design is not offered)
#   families:    editorial groups shown in the dashboard
#   categories:  Live News category ids this design suits
#   tones:       urgent serious analytical hopeful solemn explainer data statement
#   chars:       [min, max] headline length this design looks best at
templates:
  # ---- the original designs --------------------------------------------------------------------------------------
  - {id: breaking-photo, layout: breaking-photo, label: "Breaking (photo)",   family: breaking, photo: required, categories: [security-defence, geopolitics, international-affairs, pakistan-affairs], tones: [urgent, serious], chars: [30, 95]}
  - {id: navy-card,      layout: navy-card,      label: "Blue card (photo)",  family: general,  photo: required, categories: [pakistan-affairs, economy, politics-governance, international-affairs], tones: [serious, analytical, explainer], chars: [30, 100]}
  - {id: editorial,      layout: editorial,      label: "Editorial",           family: general,  photo: optional, categories: [politics-governance, economy, education, pakistan-affairs], tones: [analytical, explainer, serious], chars: [30, 110]}
  - {id: newspaper,      layout: newspaper,      label: "Newspaper",           family: politics, photo: optional, categories: [politics-governance, pakistan-affairs, international-affairs], tones: [serious, analytical, statement], chars: [30, 110]}
  - {id: typographic,    layout: typographic,    label: "Bold blue (no photo)",family: general,  photo: none,     categories: [economy, geopolitics, science-technology, pakistan-affairs], tones: [serious, analytical, explainer], chars: [30, 110]}
  - {id: impact,         layout: impact,         label: "Light cover (no photo)", family: general, photo: none,    categories: [economy, politics-governance, education, pakistan-affairs], tones: [analytical, explainer, serious], chars: [30, 100]}
  - {id: brief-light,    layout: brief-light,    label: "Light brief (photo)", family: general,  photo: required, categories: [education, economy, pakistan-affairs, climate-environment], tones: [explainer, hopeful, analytical], chars: [30, 100]}

  # ---- breaking / urgent -----------------------------------------------------------------------------------------
  - {id: bold-ink,   layout: bold-type, theme: ink,   label: "Bold black",  family: breaking, photo: optional, categories: [security-defence, geopolitics, international-affairs, politics-governance], tones: [urgent, serious, solemn], chars: [24, 80]}
  - {id: bold-red,   layout: bold-type, theme: red,   label: "Bold red",    family: breaking, photo: optional, categories: [security-defence, geopolitics, pakistan-affairs, politics-governance], tones: [urgent], chars: [24, 80]}
  - {id: bold-royal, layout: bold-type, theme: royal, label: "Bold blue",   family: breaking, photo: optional, categories: [science-technology, economy, international-affairs, geopolitics], tones: [urgent, analytical, serious], chars: [24, 80]}

  # ---- politics and governance -----------------------------------------------------------------------------------
  - {id: statement-paper, layout: statement-photo, theme: paper, label: "Statement (paper)", family: politics, photo: required, categories: [politics-governance, pakistan-affairs, international-affairs, geopolitics], tones: [statement, serious, analytical], chars: [30, 100]}
  - {id: statement-ink,   layout: statement-photo, theme: ink,   label: "Statement (dark)",  family: politics, photo: required, categories: [politics-governance, security-defence, geopolitics], tones: [statement, serious, solemn, urgent], chars: [30, 100]}

  # ---- economy and data ------------------------------------------------------------------------------------------
  - {id: data-blue,  layout: data-hero, theme: blue,  label: "Big number (blue)",  family: economy, photo: none, needs: [stat], categories: [economy, science-technology, climate-environment, pakistan-affairs], tones: [data, analytical, hopeful], chars: [30, 95]}
  - {id: data-ink,   layout: data-hero, theme: ink,   label: "Big number (dark)",  family: economy, photo: none, needs: [stat], categories: [economy, security-defence, geopolitics, international-affairs], tones: [data, serious, urgent], chars: [30, 95]}
  - {id: data-paper, layout: data-hero, theme: paper, label: "Big number (paper)", family: economy, photo: none, needs: [stat], categories: [economy, education, politics-governance, pakistan-affairs], tones: [data, explainer, analytical], chars: [30, 95]}

  # ---- education and explainers ----------------------------------------------------------------------------------
  - {id: notes-mint,  layout: field-notes, theme: mint,  label: "Field notes (mint)",  family: education, photo: optional, categories: [education, science-technology, climate-environment, pakistan-affairs], tones: [explainer, hopeful, analytical], chars: [30, 90]}
  - {id: notes-sky,   layout: field-notes, theme: sky,   label: "Field notes (sky)",   family: education, photo: optional, categories: [education, economy, science-technology, international-affairs], tones: [explainer, analytical, data], chars: [30, 90]}
  - {id: notes-coral, layout: field-notes, theme: coral, label: "Field notes (coral)", family: education, photo: optional, categories: [education, politics-governance, pakistan-affairs, geopolitics], tones: [explainer, urgent, statement], chars: [30, 90]}

  # ---- politics: covers and statements ---------------------------------------------------------------------------
  - {id: cover-green, layout: magazine-cover, theme: green, label: "Magazine cover (green)", family: politics, photo: required, categories: [politics-governance, international-affairs, geopolitics, pakistan-affairs], tones: [analytical, serious, statement], chars: [20, 60]}
  - {id: cover-ink,   layout: magazine-cover, theme: ink,   label: "Magazine cover (dark)",  family: politics, photo: required, categories: [geopolitics, security-defence, politics-governance, economy], tones: [serious, analytical, urgent], chars: [20, 60]}
  - {id: quote-royal, layout: quote-card, theme: royal, label: "Quote (blue)",  family: politics, photo: optional, needs: [quote], categories: [politics-governance, pakistan-affairs, international-affairs, education, economy], tones: [statement, hopeful, serious], chars: [20, 110]}
  - {id: quote-paper, layout: quote-card, theme: paper, label: "Quote (paper)", family: politics, photo: optional, needs: [quote], categories: [politics-governance, geopolitics, security-defence, international-affairs], tones: [statement, serious, solemn], chars: [20, 110]}

  # ---- economy ---------------------------------------------------------------------------------------------------
  - {id: ledger-collage, layout: ledger-collage, label: "Ledger collage", family: economy, photo: optional, categories: [economy, pakistan-affairs, politics-governance], tones: [analytical, serious, data], chars: [30, 80]}

  # ---- world: scrapbook / evidence board -------------------------------------------------------------------------
  - {id: dossier-paper, layout: dossier-board, theme: paper, label: "Evidence board (paper)", family: world, photo: required, categories: [geopolitics, international-affairs, security-defence, politics-governance], tones: [analytical, serious, explainer], chars: [30, 85]}
  - {id: dossier-slate, layout: dossier-board, theme: slate, label: "Evidence board (slate)", family: world, photo: required, categories: [international-affairs, geopolitics, science-technology, economy], tones: [analytical, explainer, serious], chars: [30, 85]}

  # ---- security / solemn -----------------------------------------------------------------------------------------
  - {id: solemn-dusk, layout: solemn-serif, theme: dusk, label: "Solemn", family: security, photo: required, categories: [security-defence, geopolitics, international-affairs, pakistan-affairs], tones: [solemn, serious, hopeful], chars: [10, 42]}

  # ---- science and technology ------------------------------------------------------------------------------------
  - {id: tech-royal, photo_heavy: true,  layout: tech-highlight, theme: royal,  label: "Tech (blue)",   family: science-tech, photo: optional, categories: [science-technology, economy, education, geopolitics], tones: [analytical, explainer, hopeful, urgent], chars: [30, 95]}
  - {id: tech-violet, photo_heavy: true, layout: tech-highlight, theme: violet, label: "Tech (violet)", family: science-tech, photo: optional, categories: [science-technology, climate-environment, education, international-affairs], tones: [analytical, explainer, hopeful], chars: [30, 95]}
  - {id: circle-teal, photo_heavy: true, layout: dark-circle, theme: teal, label: "Explainer circle (teal)", family: science-tech, photo: optional, categories: [science-technology, climate-environment, economy, education], tones: [explainer, analytical, hopeful], chars: [25, 70]}
  - {id: circle-ink, photo_heavy: true,  layout: dark-circle, theme: ink,  label: "Explainer circle (night)", family: science-tech, photo: optional, categories: [science-technology, geopolitics, security-defence, politics-governance], tones: [analytical, serious, explainer], chars: [25, 70]}

  # ---- climate and environment -----------------------------------------------------------------------------------
  - {id: sage-grid, photo_heavy: true, layout: sage-grid, theme: sage, label: "Notebook (sage)", family: climate, photo: optional, categories: [climate-environment, education, science-technology, pakistan-affairs], tones: [hopeful, explainer, analytical], chars: [20, 60]}
  - {id: mist-grid, photo_heavy: true, layout: sage-grid, theme: mist, label: "Notebook (mist)", family: climate, photo: optional, categories: [climate-environment, economy, science-technology, international-affairs], tones: [explainer, analytical, serious], chars: [20, 60]}

  # ---- society and human interest --------------------------------------------------------------------------------
  - {id: stat-coral,  layout: stat-column, theme: coral, label: "Photo and facts", family: society, photo: required, categories: [pakistan-affairs, education, climate-environment, economy, security-defence], tones: [data, serious, hopeful, solemn], chars: [25, 70]}
  - {id: human-warm,  layout: human-story, theme: warm,  label: "Human story",     family: society, photo: required, categories: [education, pakistan-affairs, climate-environment, politics-governance], tones: [hopeful, solemn, explainer, serious], chars: [25, 75]}
