# Daily news posters on GitHub Actions with free AI (Gemini first, NVIDIA NIM as backup).
#
# Output goes to the branch in repo variable POSTERS_OUT_BRANCH (default: daily-posters-test).
#   Testing (now):   POSTERS_OUT_BRANCH=daily-posters-test, POSTERS_TEST_MODE=true
#                    -> one batch of posters per run, each run ADDS a new batch
#   Production:      POSTERS_OUT_BRANCH=daily-posters, POSTERS_TEST_MODE=false, cron once a day
#                    -> one batch per day; skipped if today's posters already exist
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   GEMINI_API_KEY (primary), NVIDIA_API_KEY (backup), CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN
name: Daily posters (free AI)

on:
  schedule:
    # Once a day at 07:40 Asia/Karachi. Produces one batch (5 posters) per day.
    - cron: "40 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # lets the gate job switch the workflow off when the fast-test window ends

concurrency:
  group: daily-posters   # one run at a time across all branches (they share the output branch)
  cancel-in-progress: false

jobs:
  # Scheduled runs only go ahead inside the fast-test window (repo variable POSTERS_FAST_TEST_UNTIL,
  # UTC ISO time). Once it has passed, the workflow disables itself so it stops using free minutes.
  # Manual runs (Actions -> Run workflow) always go ahead.
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          UNTIL: ${{ vars.POSTERS_FAST_TEST_UNTIL }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ -z "$UNTIL" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$(date -u +%s)" -lt "$(date -u -d "$UNTIL" +%s)" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "Fast-test window ended at $UNTIL; disabling this workflow."
          gh workflow disable "${{ github.workflow }}" -R "${{ github.repository }}"
          echo "go=false" >> "$GITHUB_OUTPUT"

  posters:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OUT_BRANCH: ${{ vars.POSTERS_OUT_BRANCH || 'daily-posters-test' }}
      TEST_MODE: ${{ vars.POSTERS_TEST_MODE || 'true' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Today's date (Pakistan time)
        run: echo "TODAY=$(TZ=Asia/Karachi date +%F)" >> "$GITHUB_ENV"

      - name: Prepare output branch
        id: out
        run: |
          git config user.name "pakimtehan-posters[bot]"
          git config user.email "posters@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$OUT_BRANCH" >/dev/null; then
            git fetch origin "$OUT_BRANCH"
            git worktree add out "origin/$OUT_BRANCH"
            git -C out switch -c "$OUT_BRANCH"
          else
            git worktree add --orphan -b "$OUT_BRANCH" out
          fi
          if [ "$TEST_MODE" != "true" ] && [ -f "out/posters/$TODAY/posters.json" ]; then
            echo "Posters for $TODAY already exist on $OUT_BRANCH; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          mkdir -p state
          [ -f out/state/seen.json ] && cp out/state/seen.json state/seen.json || true

      - uses: actions/setup-python@v7
        if: steps.out.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.out.outputs.skip != 'true'
        run: pip install -r requirements.txt

      # Cheapest possible gate: one 1-token request per AI provider. If they are all out of quota,
      # stop here instead of downloading Chromium and burning runner minutes on a run that cannot finish.
      - name: Check AI providers (fail fast)
        if: steps.out.outputs.skip != 'true'
        run: python ai_editor.py check

      - name: Install Chromium
        if: steps.out.outputs.skip != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Fetch news
        if: steps.out.outputs.skip != 'true'
        run: python build.py fetch

      - name: Choose stories and write text (free AI)
        if: steps.out.outputs.skip != 'true'
        run: python ai_editor.py write

      - name: Find and choose photos
        if: steps.out.outputs.skip != 'true'
        run: |
          python build.py photos
          python ai_editor.py photos

      - name: Render posters
        if: steps.out.outputs.skip != 'true'
        run: python build.py render

      - name: Publish to ${{ env.OUT_BRANCH }}
        if: steps.out.outputs.skip != 'true'
        run: |
          mkdir -p out/posters out/state
          if [ "$TEST_MODE" = "true" ]; then PREFIX=$(TZ=Asia/Karachi date +%H%M); else PREFIX=""; fi
          python scripts/merge_batch.py "posters/$TODAY" "out/posters/$TODAY" $PREFIX
          cp state/seen.json out/state/seen.json
          cd out
          git add "posters/$TODAY" state/seen.json
          git commit -m "Posters for $TODAY ${PREFIX:+$PREFIX }(free AI)"
          for i in 1 2 3; do
            git push origin "$OUT_BRANCH" && exit 0
            git pull --rebase origin "$OUT_BRANCH"
          done
          exit 1

      - name: Summary
        if: always() && steps.out.outputs.skip != 'true'
        run: |
          {
            echo "## Posters for $TODAY -> \`$OUT_BRANCH\`"
            python -c "import json;[print(f\"- **{p['headline']}** ({p.get('_editor','?')}, {p.get('template','?')})\") for p in json.load(open('posters/$TODAY/posters.json'))]" 2>/dev/null || echo "No posters produced."
          } >> "$GITHUB_STEP_SUMMARY"
