# Daily news posters on GitHub Actions with free AI (Gemini first, NVIDIA NIM / OpenRouter as backup).
#
# Started by the Cloudflare Worker `pakimtehan-posters` (cloudflare/worker), not by GitHub's own cron,
# which never fired for this repo. Its schedule is `crons` in cloudflare/worker/wrangler.toml.
#
# Output: posters are stored in the Worker (Cloudflare D1) with every value used to make them, and
# wait there until an admin approves (server copies them to its own disk) or rejects them in the
# dashboard. Nothing is committed to GitHub.
#   POSTERS_TEST_MODE=true  -> every run adds a batch (several a day)
#   POSTERS_TEST_MODE=false -> one batch a day; skipped if today's batch is already stored
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   POSTERS_STORE_TOKEN (+ variable POSTERS_STORE_URL): the Worker's storage API
#   GEMINI_API_KEY (primary), NVIDIA_API_KEY + OPENROUTER_API_KEY (backups),
#   CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN (last-resort AI),
#   PEXELS_API_KEY, UNSPLASH_ACCESS_KEY, PIXABAY_API_KEY (optional photo libraries; without them
#   only the keyless Openverse and Wikimedia Commons are searched)
name: Daily posters (free AI)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-posters   # one run at a time
  cancel-in-progress: false

jobs:
  posters:
    runs-on: ubuntu-latest
    timeout-minutes: 40   # up to 15 posters per run: ~2 min AI pacing + up to 15 photo searches
    env:
      TEST_MODE: ${{ vars.POSTERS_TEST_MODE || 'true' }}
      POSTERS_STORE_URL: ${{ vars.POSTERS_STORE_URL }}
      POSTERS_STORE_TOKEN: ${{ secrets.POSTERS_STORE_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Date and batch time (Pakistan time)
        run: |
          echo "TODAY=$(TZ=Asia/Karachi date +%F)" >> "$GITHUB_ENV"
          echo "BATCH=$(TZ=Asia/Karachi date +%H%M)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # The Worker starts a run every hour. This only stops a manual start from doubling a run that just finished.
      - name: Ran in the last 20 minutes? (production only)
        id: done
        run: |
          if [ "$TEST_MODE" != "true" ] && python store.py ran-recently 20; then
            echo "A batch was stored less than 20 minutes ago; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Load seen links
        if: steps.done.outputs.skip != 'true'
        run: python store.py pull-state

      # Cheapest possible gate: one 1-token request per AI provider. If they are all out of quota,
      # stop here instead of downloading Chromium and burning runner minutes on a run that cannot finish.
      - name: Check AI providers (fail fast)
        if: steps.done.outputs.skip != 'true'
        run: python ai_editor.py check

      # Informational only: a poster still renders (without a photo) if every image provider is down.
      - name: Check image providers
        if: steps.done.outputs.skip != 'true'
        run: python images.py check || true

      - name: Fetch news
        if: steps.done.outputs.skip != 'true'
        run: python build.py fetch

      # Quiet hours: too few unseen headlines to make good posters. Stop here, before the slow steps (Chromium, photos,
      # rendering). The headlines are not marked as seen, so the next run picks them up.
      - name: Enough new headlines?
        id: news
        if: steps.done.outputs.skip != 'true'
        run: |
          N=$(python -c "import json;print(len(json.load(open('work/headlines.json'))))")
          MIN=$(python -c "import yaml;print(yaml.safe_load(open('config/sources.yaml'))['settings'].get('min_new_headlines', 6))")
          echo "$N unseen headlines (need $MIN)"
          if [ "$N" -ge "$MIN" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "Quiet hour: nothing to publish this run."; fi

      - name: Choose stories and write text (free AI)
        if: steps.news.outputs.go == 'true'
        run: python ai_editor.py write

      # FACT-CHECK GATE (client rule: nothing unchecked is ever published). Reads the articles, compares every claim with
      # them, and keeps only posters that pass. Fails closed: a poster the checker could not verify is dropped.
      - name: Fact-check posters
        id: facts
        if: steps.news.outputs.go == 'true'
        run: python ai_editor.py verify

      - name: Find and choose photos
        if: steps.facts.outputs.ok == 'true'
        run: |
          python build.py photos
          python ai_editor.py photos

      - name: Install Chromium
        if: steps.facts.outputs.ok == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Render posters
        if: steps.facts.outputs.ok == 'true'
        run: python build.py render

      - name: Store posters for review (Cloudflare)
        if: steps.facts.outputs.ok == 'true'
        run: |
          python store.py upload "posters/$TODAY" "$BATCH"
          python store.py push-state "$TODAY"

      - name: Summary
        if: always() && steps.facts.outputs.ok == 'true'
        run: |
          {
            echo "## Posters for $TODAY, batch $BATCH (stored for review in the dashboard)"
            python -c "import json;[print(f\"- **{p['headline']}** ({p.get('_editor','?')}, {p.get('template','?')})\") for p in json.load(open('posters/$TODAY/posters.json'))]" 2>/dev/null || echo "No posters produced."
          } >> "$GITHUB_STEP_SUMMARY"
