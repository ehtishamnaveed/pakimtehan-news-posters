name = "pakimtehan-posters-trigger"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = false

[triggers]
# Cron is in UTC. TEST: 07:40 UTC = 12:40 Asia/Karachi, once. A new or changed cron takes up to
# 15 minutes to reach Cloudflare's network, so set test times at least 20 minutes ahead.
# Every 2 hours later: "23 */2 * * *". Daily production: "40 2 * * *" (07:40 Asia/Karachi).
crons = ["40 7 * * *"]

[observability]
enabled = true
